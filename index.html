<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Abhishek Needs a Friend: Survey Responses</title>
    <link rel="stylesheet" href="styles.css">
    <script src="slides.js" defer></script>
  </head>
  <body>
    <main aria-label="Presentation">
      <section class="slide title-slide" aria-labelledby="title">
        <h1 id="title">Abhishek Needs a Friend: Survey Responses</h1>
      </section>

      <section class="slide" aria-labelledby="form-title" hidden>
        <h2 id="form-title">Friendship Audit</h2>
        <div class="slide-body form-body">
          <figure class="screenshot">
            <img src="assets/form.png" alt="WhatsApp message sharing the form">
            <figcaption class="missing-image" hidden>assets/form.png</figcaption>
          </figure>
        </div>
      </section>

      <section class="slide response-slide" aria-labelledby="embarrassment-title" hidden>
        <h2 id="embarrassment-title">Spectrum of Emotions</h2>
        <div class="slide-body response-body">
          <figure class="response-media">
            <figure class="screenshot">
              <img src="assets/embarassment.png" alt="WhatsApp response expressing embarrassment">
              <figcaption class="missing-image" hidden>assets/embarassment.png</figcaption>
            </figure>
            <figcaption class="emotion-caption">Second-hand Embarrasment</figcaption>
          </figure>
        </div>
      </section>

      <section class="slide response-slide" aria-labelledby="glee-title" hidden>
        <h2 id="glee-title">Spectrum of Emotions</h2>
        <div class="slide-body response-body">
          <figure class="response-media response-media--glee">
            <figure class="screenshot">
              <img src="assets/glee-2.png" alt="WhatsApp response expressing interest and offering to roast Abhishek">
              <figcaption class="missing-image" hidden>assets/glee-2.png</figcaption>
            </figure>
            <figure class="screenshot">
              <img src="assets/glee.png" alt="WhatsApp response: I laughed while writing this">
              <figcaption class="missing-image" hidden>assets/glee.png</figcaption>
            </figure>
            <figcaption class="emotion-caption">Glee</figcaption>
          </figure>
        </div>
      </section>

      <section class="slide" aria-labelledby="findings-title" hidden>
        <h2 id="findings-title">Key findings</h2>
        <div class="slide-body findings-body">
          <div class="chart-body">
            <p class="sentiment-note">Sentiment of form responses</p>
            <div class="pie" role="img" aria-label="Pie chart: overwhelmingly negative sentiment, with a small positive segment"></div>
            <div class="legend">
              <p><span class="swatch negative" aria-hidden="true"></span>negative</p>
              <p><span class="swatch positive" aria-hidden="true"></span>positive</p>
            </div>
          </div>
          <p class="hero-stat"><strong>1 in 5</strong><span>respondents would recommend Abhishek as a friend.</span></p>
        </div>
      </section>
    </main>
    <nav class="controls" aria-label="Slide controls">
      <button id="previous" type="button" aria-label="Previous slide" title="Previous (Left Arrow)">Previous</button>
      <span id="position" aria-live="polite" aria-atomic="true">1 / 5</span>
      <button id="next" type="button" aria-label="Next slide" title="Next (Right Arrow or Space)">Next</button>
    </nav>
  </body>
</html>
