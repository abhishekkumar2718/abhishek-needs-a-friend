<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Abhishek Needs a Friend: Survey Responses</title>
    <link rel="stylesheet" href="styles.css">
    <script src="slides.js" defer></script>
  </head>
  <body>
    <main aria-label="Presentation">
      <section class="slide title-slide" aria-labelledby="title">
        <h1 id="title">Abhishek Needs a Friend: Survey Responses</h1>
      </section>

      <section class="slide" aria-labelledby="form-title" hidden>
        <h2 id="form-title">The Form</h2>
        <div class="slide-body form-body">
          <figure class="screenshot">
            <img src="assets/form.png" alt="WhatsApp message sharing the form">
            <figcaption class="missing-image" hidden>assets/form.png</figcaption>
          </figure>
        </div>
      </section>

      <section class="slide spectrum-slide" aria-labelledby="spectrum-title" data-step="0" hidden>
        <h2 id="spectrum-title">Spectrum of responses</h2>
        <div class="slide-body spectrum-body">
          <div class="spectrum-line" aria-hidden="true"></div>
          <div class="response response-left" data-reveal="1" hidden>
            <h3>embarassment</h3>
            <figure class="screenshot">
              <img src="assets/embarassment.png" alt="WhatsApp response expressing embarassment">
              <figcaption class="missing-image" hidden>assets/embarassment.png</figcaption>
            </figure>
          </div>
          <div class="response response-right" data-reveal="2" hidden>
            <h3>glee</h3>
            <figure class="screenshot">
              <img src="assets/glee.png" alt="WhatsApp response expressing glee">
              <figcaption class="missing-image" hidden>assets/glee.png</figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="slide" aria-labelledby="findings-title" hidden>
        <h2 id="findings-title">Friendship Performance Review - Key Findings</h2>
        <div class="slide-body chart-body">
          <div class="pie" role="img" aria-label="Pie chart: 85% negative, 15% positive"></div>
          <div class="legend">
            <p><span class="swatch negative" aria-hidden="true"></span>85% negative</p>
            <p><span class="swatch positive" aria-hidden="true"></span>15% positive</p>
          </div>
        </div>
      </section>
    </main>
    <nav class="controls" aria-label="Slide controls">
      <button id="previous" type="button" aria-label="Previous reveal or slide" title="Previous (Left Arrow)">Previous</button>
      <span id="position" aria-live="polite" aria-atomic="true">1 / 4</span>
      <button id="next" type="button" aria-label="Next reveal or slide" title="Next (Right Arrow or Space)">Next</button>
    </nav>
  </body>
</html>
